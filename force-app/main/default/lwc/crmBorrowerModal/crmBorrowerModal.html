<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Customer" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header"><h2 class="slds-modal__title">Customer</h2></header>
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-input label="S.No (e.g. 12 or W009)" value={sNo} onchange={handleSNo} required></lightning-input>
                <lightning-input label="Full Name" value={name} onchange={handleName} required></lightning-input>
                <lightning-input label="Mobile" type="tel" value={mobile} onchange={handleMobile} required></lightning-input>
                <lightning-input label="Location" value={location} onchange={handleLocation}></lightning-input>
                <lightning-textarea label="Notes" value={notes} onchange={handleNotes}></lightning-textarea>
                <div lwc:if={error} class="crm-error" role="alert">{error}</div>
            </div>
            <footer class="slds-modal__footer">
                <div class="crm-modal-actions">
                    <lightning-button label="Cancel" onclick={handleCancel} disabled={busy}></lightning-button>
                    <lightning-button variant="brand" label="Save Customer" onclick={handleSave} disabled={busy}></lightning-button>
                </div>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
