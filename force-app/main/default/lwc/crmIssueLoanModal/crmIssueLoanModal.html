<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Loan" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header"><h2 class="slds-modal__title">Loan</h2></header>
            <div class="slds-modal__content slds-p-around_medium">
                <p lwc:if={borrowerName} class="crm-card-title">{borrowerName}</p>
                <lightning-combobox label="Repayment Type" options={typeOptions} value={repaymentType} onchange={handleType} disabled={isEdit} required></lightning-combobox>
                <lightning-input type="number" step="0.01" min="1" label="Principal (&#8377;)" value={principal} onchange={handlePrincipal} required></lightning-input>
                <c-crm-date-input label="Disbursement Date" value={disbursementDate} onchange={handleDate} show-today required></c-crm-date-input>
                <p class="crm-muted slds-m-top_small">{previewText}</p>
                <div lwc:if={error} class="crm-error" role="alert">{error}</div>
            </div>
            <footer class="slds-modal__footer">
                <div class="crm-modal-actions">
                    <lightning-button label="Cancel" onclick={handleCancel} disabled={busy}></lightning-button>
                    <lightning-button variant="brand" label="Save Loan" onclick={handleSave} disabled={busy}></lightning-button>
                </div>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
