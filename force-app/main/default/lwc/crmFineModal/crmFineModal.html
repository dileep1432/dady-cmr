<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Add Late Fine" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header"><h2 class="slds-modal__title">Add Late Fine</h2></header>
            <div class="slds-modal__content slds-p-around_medium">
                <p class="crm-card-title">{loan.borrowerName}</p>
                <p class="crm-muted slds-m-bottom_small">Loan {loan.loanCode}. The fine is added to Total Payable.</p>
                <lightning-input type="number" step="0.01" min="0.01" label="Fine Amount (&#8377;)" value={amount} onchange={handleAmount} required></lightning-input>
                <lightning-input label="Reason (why)" value={reason} onchange={handleReason} maxlength="255" required></lightning-input>
                <c-crm-date-input label="Date Charged (when)" value={fineDate} onchange={handleDate} show-today required></c-crm-date-input>
                <div lwc:if={error} class="crm-error" role="alert">{error}</div>
            </div>
            <footer class="slds-modal__footer">
                <div class="crm-modal-actions">
                    <lightning-button label="Cancel" onclick={handleCancel} disabled={busy}></lightning-button>
                    <lightning-button variant="brand" label="Add Fine" onclick={handleSave} disabled={busy}></lightning-button>
                </div>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
