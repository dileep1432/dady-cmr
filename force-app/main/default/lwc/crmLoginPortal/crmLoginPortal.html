<template>
    <div class="login-shell">
        <div class="crm-card login-card">
            <h1 class="slds-text-heading_medium slds-m-bottom_small">Microfinance CRM</h1>
            <p class="crm-muted slds-m-bottom_small">Sign in with your staff Login ID.</p>
            <lightning-input
                label="Login ID"
                autocomplete="username"
                value={loginId}
                onchange={handleLoginId}
                onkeyup={handleKey}
                required
            ></lightning-input>
            <lightning-input
                label="Password"
                type="password"
                autocomplete="current-password"
                value={password}
                onchange={handlePassword}
                onkeyup={handleKey}
                required
            ></lightning-input>
            <div lwc:if={error} class="crm-error" role="alert">{error}</div>
            <lightning-button
                class="slds-m-top_small"
                variant="brand"
                label="Log in"
                onclick={handleLogin}
                disabled={busy}
            ></lightning-button>
            <lightning-spinner lwc:if={busy} alternative-text="Signing in" size="small"></lightning-spinner>
        </div>
    </div>
</template>
